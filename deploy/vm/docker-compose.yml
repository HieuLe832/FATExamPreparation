# Production stack on the Azure VM (copied to /opt/fat-guide by the deploy workflow).
# The workflow writes /opt/fat-guide/.env with API_IMAGE, API_DOMAIN and FRONTEND_ORIGIN.
services:
  api:
    image: ${API_IMAGE:?set API_IMAGE in .env}
    restart: unless-stopped
    environment:
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env}
    expose:
      - "8080"

  # Terminates HTTPS with an automatic Let's Encrypt certificate and forwards to the API.
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
